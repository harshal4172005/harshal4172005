<svg width="880" height="260" viewBox="0 0 880 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a10"/>
      <stop offset="50%" stop-color="#0e121d"/>
      <stop offset="100%" stop-color="#07080d"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="45%" stop-color="#818cf8" stop-opacity="0.5"/>
      <stop offset="80%" stop-color="#c084fc" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Ambient Radial Glows -->
    <radialGradient id="cyanAmbient" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="purpleAmbient" cx="80%" cy="70%" r="70%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Headline Typography Gradient -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Pill Tag Background -->
    <linearGradient id="pillBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b2a"/>
      <stop offset="100%" stop-color="#0d111c"/>
    </linearGradient>

    <!-- Background Grid -->
    <pattern id="cyberGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#818cf8" stroke-opacity="0.04" stroke-width="1"/>
      <circle cx="28" cy="28" r="0.8" fill="#38bdf8" fill-opacity="0.2"/>
    </pattern>

    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      font-weight: 800;
      font-size: 42px;
      letter-spacing: -0.5px;
      fill: url(#nameGrad);
    }
    .sub-role {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 600;
      font-size: 15px;
      letter-spacing: 0.2px;
      fill: #818cf8;
    }
    .sub-detail {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 400;
      font-size: 13px;
      letter-spacing: 0.1px;
      fill: #94a3b8;
    }
    .mono-pill {
      font-family: "JetBrains Mono", "SF Mono", Consolas, monospace;
      font-weight: 600;
      font-size: 11px;
      fill: #e2e8f0;
      letter-spacing: 0.3px;
    }
    .term-title {
      font-family: "JetBrains Mono", Consolas, monospace;
      font-weight: 500;
      font-size: 11px;
      fill: #64748b;
      letter-spacing: 0.5px;
    }
    .hire-status {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 700;
      font-size: 10px;
      letter-spacing: 0.8px;
      fill: #34d399;
      text-transform: uppercase;
    }
  </style>

  <!-- Card Background & Glows -->
  <rect x="2" y="2" width="876" height="256" rx="14" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="876" height="256" rx="14" fill="url(#cyanAmbient)"/>
  <rect x="2" y="2" width="876" height="256" rx="14" fill="url(#purpleAmbient)"/>
  <rect x="2" y="2" width="876" height="256" rx="14" fill="url(#cyberGrid)"/>
  <rect x="2" y="2" width="876" height="256" rx="14" stroke="url(#borderGlow)" stroke-width="1.5"/>

  <!-- Top Terminal Bar -->
  <path d="M 2 16 Q 2 2 16 2 L 864 2 Q 878 2 878 16 L 878 38 L 2 38 Z" fill="#07090e" fill-opacity="0.7"/>
  <line x1="2" y1="38" x2="878" y2="38" stroke="#1e293b" stroke-width="1"/>

  <!-- Window Control Buttons -->
  <circle cx="24" cy="20" r="5" fill="#f43f5e" opacity="0.85"/>
  <circle cx="40" cy="20" r="5" fill="#fbbf24" opacity="0.85"/>
  <circle cx="56" cy="20" r="5" fill="#34d399" opacity="0.85"/>

  <!-- Terminal Path Breadcrumb -->
  <text x="80" y="24" class="term-title">harshal@nexai-labs:~ / ai-systems.py</text>

  <!-- Top Right Available Status Pill -->
  <g transform="translate(680, 10)">
    <rect width="180" height="20" rx="10" fill="#0f172a" stroke="#10b981" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="12" cy="10" r="3.5" fill="#10b981" filter="url(#nodeGlow)"/>
    <circle cx="12" cy="10" r="2.5" fill="#34d399"/>
    <text x="22" y="14" class="hire-status">AVAILABLE FOR HIRE</text>
  </g>

  <!-- Left Main Content -->
  <!-- Name Headline -->
  <text x="42" y="96" class="title-text">HARSHAL PAREKH</text>

  <!-- Role Subtitle -->
  <text x="44" y="125" class="sub-role">
    AI Engineer @ NexAI Labs &#160;•&#160; Python &amp; Vision Systems Specialist
  </text>

  <!-- Secondary Metrics Line -->
  <text x="44" y="148" class="sub-detail">
    1,030+ GitHub Contributions &#160;•&#160; B.E. Computer Engineering (8.41 CGPA) &#160;•&#160; 22 GCP Badges
  </text>

  <!-- Stack Pills Row -->
  <g transform="translate(44, 182)">
    <!-- Pill: Python -->
    <rect x="0" y="0" width="82" height="28" rx="6" fill="url(#pillBg)" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1"/>
    <text x="14" y="18" class="mono-pill">Python</text>

    <!-- Pill: PyTorch -->
    <rect x="92" y="0" width="88" height="28" rx="6" fill="url(#pillBg)" stroke="#818cf8" stroke-opacity="0.35" stroke-width="1"/>
    <text x="14" y="18" class="mono-pill" transform="translate(92, 0)">PyTorch</text>

    <!-- Pill: YOLOv8 -->
    <rect x="190" y="0" width="86" height="28" rx="6" fill="url(#pillBg)" stroke="#818cf8" stroke-opacity="0.35" stroke-width="1"/>
    <text x="14" y="18" class="mono-pill" transform="translate(190, 0)">YOLOv8</text>

    <!-- Pill: FastAPI -->
    <rect x="286" y="0" width="86" height="28" rx="6" fill="url(#pillBg)" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1"/>
    <text x="14" y="18" class="mono-pill" transform="translate(286, 0)">FastAPI</text>

    <!-- Pill: LangChain -->
    <rect x="382" y="0" width="102" height="28" rx="6" fill="url(#pillBg)" stroke="#c084fc" stroke-opacity="0.35" stroke-width="1"/>
    <text x="14" y="18" class="mono-pill" transform="translate(382, 0)">LangChain</text>

    <!-- Pill: Docker -->
    <rect x="494" y="0" width="82" height="28" rx="6" fill="url(#pillBg)" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1"/>
    <text x="14" y="18" class="mono-pill" transform="translate(494, 0)">Docker</text>
  </g>

  <!-- Right Geometric Neural Core Graphic -->
  <g transform="translate(735, 148)">
    <!-- Outer Orbit Ring -->
    <circle cx="0" cy="0" r="76" fill="none" stroke="#818cf8" stroke-opacity="0.2" stroke-dasharray="3 6"/>
    <!-- Middle Ring -->
    <circle cx="0" cy="0" r="54" fill="none" stroke="#38bdf8" stroke-opacity="0.35"/>
    <!-- Inner Accent Ring -->
    <circle cx="0" cy="0" r="32" fill="none" stroke="#c084fc" stroke-opacity="0.3" stroke-dasharray="2 4"/>

    <!-- Central Neural Node -->
    <circle cx="0" cy="0" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2" filter="url(#nodeGlow)"/>
    <circle cx="0" cy="0" r="6" fill="#38bdf8"/>

    <!-- Connecting Vectors & Orbiting Nodes -->
    <line x1="-54" y1="0" x2="54" y2="0" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="1"/>
    <line x1="0" y1="-54" x2="0" y2="54" stroke="#818cf8" stroke-opacity="0.2" stroke-width="1"/>
    <line x1="-38" y1="-38" x2="38" y2="38" stroke="#c084fc" stroke-opacity="0.2" stroke-width="1"/>

    <!-- Satellites -->
    <circle cx="-54" cy="0" r="5" fill="#818cf8" stroke="#e0e7ff" stroke-width="1"/>
    <circle cx="54" cy="0" r="4" fill="#38bdf8" stroke="#e0e7ff" stroke-width="1"/>
    <circle cx="0" cy="-54" r="5" fill="#34d399" stroke="#e0e7ff" stroke-width="1"/>
    <circle cx="0" cy="54" r="4" fill="#c084fc" stroke="#e0e7ff" stroke-width="1"/>
    <circle cx="38" cy="38" r="4.5" fill="#38bdf8"/>
    <circle cx="-38" cy="-38" r="4.5" fill="#f43f5e"/>
  </g>
</svg>
