<svg width="850" height="260" viewBox="0 0 850 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#07090e"/>
      <stop offset="100%" stop-color="#05060a"/>
    </linearGradient>

    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#4facfe" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#7928ca" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ff0080" stop-opacity="0.2"/>
    </linearGradient>

    <radialGradient id="cyanGlow" cx="15%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="purpleGlow" cx="85%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#7928ca" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f0f6fc"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>

    <linearGradient id="pillBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b26" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0d111a" stop-opacity="0.9"/>
    </linearGradient>

    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#ffffff" stroke-opacity="0.025" stroke-width="1"/>
    </pattern>

    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .brand-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 800;
      font-size: 38px;
      letter-spacing: -0.5px;
      fill: url(#textGradient);
    }
    .brand-sub {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 500;
      font-size: 14px;
      letter-spacing: 0.2px;
      fill: #8b949e;
    }
    .pill-text {
      font-family: "SF Mono", "JetBrains Mono", Consolas, monospace;
      font-weight: 600;
      font-size: 11px;
      fill: #58a6ff;
      letter-spacing: 0.5px;
    }
    .status-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 600;
      font-size: 11px;
      fill: #3fb950;
      letter-spacing: 0.5px;
    }
    .spec-text {
      font-family: "SF Mono", "JetBrains Mono", Consolas, monospace;
      font-weight: 500;
      font-size: 11px;
      fill: #c9d1d9;
    }
  </style>

  <!-- Main Container Card -->
  <rect x="2" y="2" width="846" height="256" rx="16" fill="url(#bgGradient)"/>
  <rect x="2" y="2" width="846" height="256" rx="16" fill="url(#cyanGlow)"/>
  <rect x="2" y="2" width="846" height="256" rx="16" fill="url(#purpleGlow)"/>
  <rect x="2" y="2" width="846" height="256" rx="16" fill="url(#grid)"/>
  <rect x="2" y="2" width="846" height="256" rx="16" stroke="url(#borderGradient)" stroke-width="1.5"/>

  <!-- Left Content Block -->
  <!-- Top Status Badge -->
  <g transform="translate(42, 38)">
    <rect width="210" height="26" rx="13" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <circle cx="14" cy="13" r="4" fill="#3fb950" filter="url(#glowEffect)"/>
    <circle cx="14" cy="13" r="3" fill="#3fb950"/>
    <text x="26" y="17" class="status-text">AVAILABLE FOR ROLES</text>
    <text x="165" y="17" class="pill-text">• 2026</text>
  </g>

  <!-- Name Headline -->
  <text x="42" y="106" class="brand-title">HARSHAL PAREKH</text>

  <!-- Description Subtitle -->
  <text x="42" y="136" class="brand-sub">
    AI Engineer @ NexAI Labs &nbsp;•&nbsp; Python &amp; Vision Systems Specialist
  </text>
  <text x="42" y="158" class="brand-sub">
    1,030+ Annual Commits &nbsp;•&nbsp; B.E. Computer Engineering (8.41 CGPA)
  </text>

  <!-- Tech Spec Pills -->
  <g transform="translate(42, 192)">
    <!-- Pill 1: Python -->
    <rect x="0" y="0" width="76" height="26" rx="6" fill="url(#pillBg)" stroke="#388bfd" stroke-opacity="0.4" stroke-width="1"/>
    <text x="14" y="17" class="spec-text">Python</text>

    <!-- Pill 2: FastAPI -->
    <rect x="84" y="0" width="76" height="26" rx="6" fill="url(#pillBg)" stroke="#388bfd" stroke-opacity="0.3" stroke-width="1"/>
    <text x="96" y="17" class="spec-text">FastAPI</text>

    <!-- Pill 3: PyTorch -->
    <rect x="168" y="0" width="80" height="26" rx="6" fill="url(#pillBg)" stroke="#388bfd" stroke-opacity="0.3" stroke-width="1"/>
    <text x="180" y="17" class="spec-text">PyTorch</text>

    <!-- Pill 4: YOLOv8 -->
    <rect x="256" y="0" width="78" height="26" rx="6" fill="url(#pillBg)" stroke="#388bfd" stroke-opacity="0.3" stroke-width="1"/>
    <text x="268" y="17" class="spec-text">YOLOv8</text>

    <!-- Pill 5: LangChain -->
    <rect x="342" y="0" width="94" height="26" rx="6" fill="url(#pillBg)" stroke="#388bfd" stroke-opacity="0.3" stroke-width="1"/>
    <text x="354" y="17" class="spec-text">LangChain</text>

    <!-- Pill 6: Docker -->
    <rect x="444" y="0" width="72" height="26" rx="6" fill="url(#pillBg)" stroke="#388bfd" stroke-opacity="0.3" stroke-width="1"/>
    <text x="456" y="17" class="spec-text">Docker</text>
  </g>

  <!-- Right Geometric Tech Graphics -->
  <g transform="translate(680, 130)">
    <!-- Outer Orbit Circle -->
    <circle cx="0" cy="0" r="82" fill="none" stroke="#7928ca" stroke-opacity="0.2" stroke-dasharray="4 6"/>
    <circle cx="0" cy="0" r="58" fill="none" stroke="#00f2fe" stroke-opacity="0.25"/>

    <!-- Neural Connect Lines -->
    <path d="M -40 -40 L 40 40 M -40 40 L 40 -40 M 0 -58 L 0 58 M -58 0 L 58 0" stroke="#00f2fe" stroke-opacity="0.18" stroke-width="1"/>

    <!-- Glowing Nodes -->
    <circle cx="0" cy="0" r="18" fill="#0d1117" stroke="#00f2fe" stroke-width="2"/>
    <circle cx="0" cy="0" r="8" fill="#00f2fe" opacity="0.85"/>

    <circle cx="-42" cy="-28" r="6" fill="#7928ca" stroke="#c084fc" stroke-width="1.5"/>
    <circle cx="48" cy="-24" r="5" fill="#00f2fe" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="-32" cy="42" r="5" fill="#ff0080" stroke="#f43f5e" stroke-width="1.5"/>
    <circle cx="38" cy="38" r="7" fill="#7928ca" stroke="#a855f7" stroke-width="1.5"/>
    <circle cx="0" cy="-58" r="4" fill="#00f2fe"/>
    <circle cx="0" cy="58" r="4" fill="#3fb950"/>
  </g>
</svg>
