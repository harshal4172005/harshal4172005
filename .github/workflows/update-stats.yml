name: Living engineering profile

on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [profile-activity]
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: living-profile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify activity renderer
        run: python -m unittest discover -s tests -v
      - name: Fetch GitHub data and render activity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_stats.py
      - name: Publish only when activity changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/hero-total-contributions.svg assets/activity-totals.svg data/activity.json README.md
          if ! git diff --cached --quiet; then
            git commit -m 'chore(activity): refresh engineering field'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
