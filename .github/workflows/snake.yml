name: Generate Snake Animation

on:
  # Legacy asset, retained for manual use. The profile uses activity-field.svg.
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Generate Snake SVG
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Remove bottom loading bar
        run: |
          sudo chmod -R 777 dist
          sed -i -E 's/<rect class="u [^"]*"[^>]*\/>//g' dist/*.svg
          sed -i 's/height="192"/height="148"/g' dist/*.svg
          sed -i 's/viewBox="-16 -32 880 192"/viewBox="-16 -32 880 148"/g' dist/*.svg

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
